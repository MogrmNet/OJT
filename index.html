<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WE CCA | OJT Training Hub</title>
<meta name="description" content="مرجع تدريبي تفاعلي شخصي لسيناريوهات خدمة العملاء الفنية أثناء فترة OJT">
<style>
:root{--bg:#f5f3fb;--card:#ffffff;--text:#1f1633;--muted:#6b6380;--p:#4c1d95;--p2:#7c3aed;--soft:#ede9fe;--line:#e2dcf3;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--shadow:0 4px 18px rgba(76,29,149,.09);--side:285px}
[data-theme="dark"]{--bg:#120c22;--card:#1c1431;--text:#efeafc;--muted:#a79fc0;--p:#c4b5fd;--p2:#8b5cf6;--soft:#2a1f47;--line:#352a58;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1414;--warn:#fbbf24;--warnbg:#3a2c0b;--shadow:0 4px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.85;font-size:16px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font-family:inherit;cursor:pointer}
a{color:var(--p2);text-decoration:none}
header{position:fixed;top:0;right:0;left:0;height:62px;background:linear-gradient(90deg,#3b1480,#6d28d9);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25)}
header .brand{font-weight:800;font-size:1.05rem;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:.9rem}
.hbtn:hover{background:rgba(255,255,255,.28)}
#menuBtn{display:none}
.searchWrap{position:relative;flex:1;max-width:520px;margin-inline-start:auto}
#search{width:100%;border:0;border-radius:12px;padding:9px 14px;font-family:inherit;font-size:.95rem;background:rgba(255,255,255,.95);color:#1f1633}
#results{position:absolute;top:46px;right:0;left:0;background:var(--card);color:var(--text);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;border:1px solid var(--line)}
#results a{display:block;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--text)}
#results a:hover{background:var(--soft)}
#results small{color:var(--muted);display:block}
.topbar{position:fixed;top:62px;right:0;left:0;height:5px;background:rgba(124,58,237,.18);z-index:49}
.topbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#f0abfc);transition:width .4s}
aside{position:fixed;top:67px;bottom:0;right:0;width:var(--side);background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:14px 10px 30px;z-index:40}
aside h4{margin:14px 8px 6px;color:var(--muted);font-size:.8rem;letter-spacing:.5px}
aside a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--text);font-size:.93rem}
aside a:hover{background:var(--soft)}
aside a.active{background:var(--p2);color:#fff}
aside a .n{min-width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-size:.75rem;font-weight:700}
aside a.active .n{background:rgba(255,255,255,.25);color:#fff}
aside a .tick{margin-inline-start:auto;color:var(--ok);font-size:.85rem}
main{margin-right:var(--side);padding:92px 26px 50px;max-width:1100px}
.hero{background:linear-gradient(135deg,#3b1480,#7c3aed 60%,#c026d3);color:#fff;border-radius:22px;padding:30px 28px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 6px;font-size:2rem}
.hero p{margin:0;opacity:.92}
.grid{display:grid;gap:14px;margin:18px 0}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:2rem;color:var(--p2);line-height:1.2}
.stat span{color:var(--muted);font-size:.92rem}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#d946ef);border-radius:99px;transition:width .4s}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:1rem;font-weight:700;background:var(--p2);color:#fff;display:inline-block}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--soft);color:var(--p)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
h2{color:var(--p);margin:26px 0 10px}
h3{margin:0 0 8px;color:var(--p);font-size:1.08rem;display:flex;gap:8px;align-items:center}
h3 .num{background:var(--p2);color:#fff;border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.8rem}
.secHead{background:linear-gradient(135deg,#3b1480,#7c3aed);color:#fff;border-radius:20px;padding:22px 26px;margin-bottom:16px}
.secHead h1{margin:0;font-size:1.6rem}
.secHead .en{opacity:.9;font-size:1.1rem}
.badge{display:inline-block;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:700}
.chip{display:inline-block;background:var(--soft);color:var(--p);border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:700}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
ul,ol{margin:6px 0;padding-inline-start:22px}
li{margin:4px 0}
li.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:4px 10px;list-style:none;margin-inline-start:-22px;font-weight:600}
.script{background:var(--soft);border-inline-start:5px solid var(--p2);border-radius:10px;padding:10px 14px;margin:8px 0}
.script small{color:var(--muted);display:block;font-weight:700}
.dec li{list-style:none;margin-inline-start:-18px}
.mist{border-inline-start:5px solid var(--bad)}
.sum{border-inline-start:5px solid var(--ok)}
.confirmBox{background:var(--warnbg);color:var(--warn);border:1px dashed var(--warn);border-radius:12px;padding:10px 14px;margin:10px 0}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.qtext{font-weight:700;font-size:1.05rem;margin:8px 0 12px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:center;text-align:start;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-size:1rem}
.opt b{background:var(--soft);color:var(--p);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-family:Arial,sans-serif}
.opt:not(:disabled):hover{border-color:var(--p2);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb p{margin:4px 0;color:var(--text)}
.lvls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.lvls button{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 16px;font-weight:700}
.lvls button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.score{text-align:center;padding:28px}
.score .big{font-size:3.2rem;font-weight:800;color:var(--p2)}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:10px;text-align:start;vertical-align:top}
th{color:var(--p)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gl .card{padding:14px 16px}
.gl h3{direction:ltr;text-align:right;margin-bottom:4px}
footer.note{margin-top:34px;padding:14px 18px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:.88rem}
.tags a{display:inline-block;margin:4px;background:var(--soft);color:var(--p);padding:4px 14px;border-radius:99px;font-weight:700;direction:ltr}
@media(max-width:900px){
 #menuBtn{display:block}
 aside{transform:translateX(105%);transition:transform .25s;box-shadow:-6px 0 24px rgba(0,0,0,.3)}
 body.menu-open aside{transform:none}
 main{margin-right:0;padding:90px 14px 40px}
 .g4{grid-template-columns:repeat(2,1fr)}
 .g2{grid-template-columns:1fr}
 .hero h1{font-size:1.45rem}
 header .brand span{display:none}
 .hbtn.txt{display:none}
}
@media print{
 header,.topbar,aside,.row,.btn,.lvls,.qcard,.searchWrap,.noprint{display:none!important}
 main{margin:0;padding:0;max-width:none}
 body{background:#fff;color:#000}
 .card,.secHead,.hero{box-shadow:none;background:#fff!important;color:#000!important;border:1px solid #999;break-inside:avoid}
 .secHead h1,.hero h1{color:#000}
 section.printSec{page-break-before:always}
}
</style>
</head>
<body>
<header>
 <button class="hbtn" id="menuBtn" aria-label="القائمة">☰</button>
 <div class="brand">WE CCA <span>| OJT Training Hub</span></div>
 <div class="searchWrap">
  <input id="search" type="search" placeholder="ابحث عن سيناريو أو مصطلح..." autocomplete="off">
  <div id="results"></div>
 </div>
 <button class="hbtn" id="themeBtn" title="تبديل الوضع">🌙</button>
 <button class="hbtn txt" id="printBtn" title="طباعة / حفظ PDF">🖨 طباعة</button>
</header>
<div class="topbar"><i id="topProg"></i></div>
<aside id="side"></aside>
<main id="main"></main>

<script>
"use strict";
/* ===================== البيانات ===================== */
var LV={1:"Basic",2:"Intermediate",3:"Scenario Challenge"};

var SECTIONS=[
{id:"s1",ar:"افتتاح المكالمة",en:"Call Opening",
 problem:"افتتاح المكالمة بأسلوب مهني، والحفاظ على التواصل مع العميل أثناء مراجعة بياناته، وإظهار التعاطف مع شكواه.",
 when:"في بداية كل مكالمة، وأثناء فتح بيانات العميل على السيستم، وعند شكوى العميل من مشكلة أو من بطء الإنترنت.",
 signs:["لا توجد أعراض فنية في هذا القسم؛ هو خاص بأسلوب التواصل.","العميل ينتظر على الخط أثناء مراجعتك لبياناته.","العميل يشتكي من مشكلة أو من بطء الإنترنت."],
 steps:["قل التحية وعرّف بنفسك: «WE، مع حضرتك [اسم الموظف]».","اسأل عن اسم العميل واستخدمه أثناء الحديث.","اطلب الرقم الأرضي بكود المحافظة، واسأل كيف تقدر تساعده.","أثناء فتح الخط على السيستم لا تترك العميل في صمت؛ أبلغه أنك تراجع حالة الخط.","عند الشكوى: اعتذر وعبّر عن التعاطف ووضح أنك ستراجع الحالة وتنفذ الخطوات المناسبة.","عند الشكوى من البطء: أظهر تقديرك لأهمية انتظام الخدمة وأنك ستتابع حسب الإجراء المعتمد."],
 decision:["إذا كنت تراجع بيانات العميل ← أبلغه بذلك واستمر في التواصل معه ولا تصمت.","إذا اشتكى العميل من مشكلة ← ابدأ بالتعاطف ثم راجع الحالة.","إذا اشتكى من بطء الإنترنت ← استخدم سكريبت الاهتمام بانتظام الخدمة."],
 sysq:["لا توجد أسئلة أو اختيارات للسيستم في هذا القسم."],
 script:[
  {h:"الافتتاح",t:"«صباح الخير/مساء الخير، WE، مع حضرتك [اسم الموظف].»"},
  {h:"الاسم",t:"«أتشرف بمعرفة اسم حضرتك.»"},
  {h:"الترحيب",t:"«أهلًا بيك يا أستاذ [اسم العميل]، يا رب تكون بخير.»"},
  {h:"الرقم",t:"«استأذنك توضحلي الرقم الأرضي بكود المحافظة، وأقدر أساعد حضرتك إزاي؟»"},
  {h:"أثناء فتح الخط على السيستم",t:"«يا أستاذ [الاسم]، أنا حاليًا هدخل أراجع تفاصيل أكتر عن حالة خط حضرتك، وإن شاء الله أقدر أساعدك. متقلقش، أنا معاك.»"},
  {h:"Empathy — التعاطف",t:"«بعتذر جدًا لحضرتك عن المشكلة اللي بتواجهك. أنا موجود معاك يا أستاذ [الاسم]، وهنراجع الحالة وننفذ الخطوات المناسبة علشان نساعدك.»"},
  {h:"الشكوى من بطء الإنترنت",t:"«أنا مقدر جدًا أهمية إن خدمة الإنترنت تكون منتظمة وسريعة عند حضرتك، وعشان كده بنهتم بمراجعة أي مشكلة بتأثر على الخدمة ونتابعها حسب الإجراء المعتمد.»"}],
 mistakes:["ترك العميل في صمت أثناء مراجعة البيانات.","إنهاء المكالمة أو طلب الاتصال مرة أخرى بدل المتابعة.","وعد العميل بحل المشكلة خلال دقائق دون ضمان ذلك."],
 summary:"رحّب، اعرف الاسم والرقم، لا تصمت أثناء فتح البيانات، وعبّر عن التعاطف مع الخطوات الواقعية فقط.",
 confirm:[]},

{id:"s2",ar:"الإنترنت متصل لكن لا يوجد اتصال فعلي",en:"Browsing",
 problem:"العميل متصل بالراوتر لكن لا يستطيع تصفح الإنترنت.",
 when:"عندما يشتكي العميل من عدم عمل الإنترنت مع بقاء الجهاز متصلًا بالراوتر.",
 signs:["الإنترنت لا يعمل.","توجد علامة تعجب أو استفهام على الاتصال.","تظهر رسالة Login.","الجهاز متصل بالراوتر ولكن لا يوجد إنترنت."],
 steps:["السيناريو الأول (اللمبات UP): تأكد من حالة اللمبات، ثم راجع الـ Logs ونتيجة الفحص، وتابع مسار الـ Troubleshooting بناءً على النتيجة، ثم تحقق من عودة الخدمة.","السيناريو الثالث (اختلاف بيانات Account): راجع بيانات الـ Account في الحقول المطلوبة، وتأكد من تطابق القيم وفقًا للمسار الصحيح، وعند وجود اختلاف اتبع إجراء التصحيح المعتمد.","السيناريو الرابع (بيانات Account غير صحيحة): راجع بيانات الحساب، ادخل إلى صفحة الراوتر عند الحاجة، صحّح البيانات فقط بالقيم المعتمدة، ثم أعد التحقق من الاتصال.","السيناريو السادس (لا توجد مشكلة واضحة): أكمل خطوات الفحص، جرّب Restart إذا كان مناسبًا ومسموحًا به في الـ Flow، وتحقق من عمل الإنترنت، وإن استمرت المشكلة أكمل التشخيص والتصعيد المعتمد."],
 decision:["إذا كانت اللمبات UP ← راجع Logs ونتيجة الفحص واتبع الـ Flow.","إذا اختلفت بيانات Account ← اتبع إجراء التصحيح المعتمد.","إذا كانت بيانات Account غير صحيحة ← صحّحها بالقيم المعتمدة فقط ثم أعد التحقق.","إذا لم توجد مشكلة واضحة ← أكمل الفحص وجرّب Restart إن كان مسموحًا، وإلا فصعّد حسب المعتمد.","⚠️ السيناريو الثاني (حالة مرتبطة بالـ HDM مع الانتظار دقيقة): الاسم والخطوة التالية غير واضحين — تحتاج إلى تأكيد."],
 sysq:["⚠️ اختيارات HDM المرتبطة بالسيناريو الثاني: مصطلح يحتاج إلى تأكيد.","⚠️ إعدادات الخدمة في صفحة الراوتر (السيناريو الخامس): اسم الإعداد غير واضح — يحتاج إلى تأكيد."],
 script:[{h:"سكريبت",t:"لا يوجد سكريبت مخصص لهذا القسم في المادة. يمكن استخدام سكريبت التعاطف من قسم «افتتاح المكالمة»."}],
 mistakes:["تغيير إعدادات الراوتر عشوائيًا.","إدخال أي بيانات للحساب لمجرد أن يعمل الإنترنت.","إغلاق المكالمة أو التصعيد المباشر دون فحص.","ذكر اسم إعداد أو اختيار غير مؤكد."],
 summary:"اللمبات UP ← Logs ونتيجة الفحص ثم الـ Flow. بيانات Account الخاطئة تُصحَّح بالقيم المعتمدة فقط. ما لم يتأكد اسمه لا تذكره.",
 confirm:["اسم حالة HDM والخطوة التالية في السيناريو الثاني","اسم إعدادات الخدمة في صفحة الراوتر"]},

{id:"s3",ar:"لمبة الإنترنت حمراء / لا يوجد IP",en:"Internet LED Red / No IP",
 problem:"لمبة الإنترنت حمراء أو مطفأة، والراوتر لا يحصل على IP، وقد تكون بقية اللمبات UP.",
 when:"عندما يكون الراوتر بدون IP أو لمبة الإنترنت حمراء/مطفأة.",
 signs:["لمبة الإنترنت حمراء أو مطفأة.","الراوتر لا يحصل على IP.","قد تكون بقية اللمبات في حالة UP."],
 steps:["اتبع الـ Troubleshooting Flow.","حدد نتيجة كل خطوة.","حدد نوع الراوتر.","⚠️ التسجيل يذكر النوعين 530 و531 لكن الاسمين يحتاجان إلى تأكيد.","في حالة محددة ذكر المدرب فصل الكهرباء وإعادة توصيلها.","إن استمرت المشكلة تابع فحص MAC وIP حسب الـ Flow.","إذا طُلبت Screenshot أرفقها في المكان المخصص وفق تعليمات العمل.","أكمل خطوات الفحص والتصعيد حسب النتيجة."],
 decision:["اسأل: «هل حضرتك أجريت أي تغييرات في إعدادات الراوتر مؤخرًا؟»","إذا أجاب بنعم ← حدد نوع التغيير واتبع المسار المناسب.","إذا أجاب بلا ← تحقق من بقية التفاصيل ومنها هل الراوتر جديد، وفق الـ Flow."],
 sysq:["⚠️ اسما الراوترين 530 و531: يحتاجان إلى تأكيد."],
 script:[{h:"سؤال التغييرات",t:"«هل حضرتك أجريت أي تغييرات في إعدادات الراوتر مؤخرًا؟»"}],
 mistakes:["تغيير إعدادات غير معروفة.","إغلاق الشكوى فورًا.","ضمان الحل قبل الفحص."],
 summary:"لا IP ← اتبع الـ Flow، حدد نوع الراوتر لأن التشخيص قد يختلف، واسأل عن تغييرات الإعدادات الأخيرة.",
 confirm:["الاسم الدقيق لراوترَي 530 و531"]},

{id:"s4",ar:"عدم الاستقرار المنطقي",en:"Logical Instability",
 problem:"العميل يقول إن الإنترنت بيفصل ويشتغل بشكل متكرر، مع ظهور اللمبات UP في الحالة المذكورة بالتسجيل.",
 when:"عند شكوى فصل متكرر مع اللمبات UP وفق نتيجة الفحص ومسار Internet Stability / Instability.",

var KEY="we_cca_ojt_v1";
var st={ans:{},visited:{},theme:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object"){st.ans=p.ans||{};st.visited=p.visited||{};st.theme=p.theme||null;}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function secById(id){return SECTIONS.filter(function(s){return s.id===id;})[0];}
function secName(id){var s=secById(id);return s?s.ar:"";}
function qsOf(id){return QS.filter(function(q){return q.sec===id;});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var ORD={};
function order(q){if(!ORD[q.id])ORD[q.id]=shuffle([0,1,2,3]);return ORD[q.id];}
function counts(){var ans=0,ok=0;QS.forEach(function(q){var a=st.ans[q.id];if(a){ans++;if(a.ok)ok++;}});return {ans:ans,ok:ok,total:QS.length,vis:Object.keys(st.visited).filter(function(k){return secById(k);}).length};}

function updateStats(){

 var top=$("#topProg");if(top)top.style.width=Math.round(((c.ans/c.total)+(c.vis/SECTIONS.length))/2*100)+"%";

/* ===================== بطاقة السؤال ===================== */
function qCard(q,cb){
 var box=document.createElement("div");box.className="qcard";
 function draw(){
  var a=st.ans[q.id],ord=order(q);
  var h='<div><span class="chip">'+LV[q.lvl]+'</span> <span class="chip ghost">'+esc(secName(q.sec))+'</span></div><p class="qtext">'+esc(q.q)+'</p><div class="opts">';
  ord.forEach(function(oi,k){
   var cls="opt";if(a){if(oi===q.a)cls+=" right";else if(oi===a.c)cls+=" wrong";}
   h+='<button class="'+cls+'" data-oi="'+oi+'"'+(a?" disabled":"")+'><b>'+"ABCD"[k]+'</b><span>'+esc(q.o[oi])+'</span></button>';
  });
  h+="</div>";
  if(a){
   h+='<div class="fb '+(a.ok?"ok":"bad")+'"><strong>'+(a.ok?"✔ إجابة صحيحة":"✘ إجابة خاطئة")+'</strong><p>الإجابة الصحيحة: '+"ABCD"[ord.indexOf(q.a)]+". "+esc(q.o[q.a])+'</p><p>'+esc(q.e)+'</p><button class="btn ghost retry">إعادة المحاولة</button></div>';
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
   if(st.ans[q.id])return;var oi=+b.getAttribute("data-oi");
   st.ans[q.id]={c:oi,ok:oi===q.a};save();draw();updateStats();if(cb)cb();};});
  var r=box.querySelector(".retry");
  if(r)r.onclick=function(){delete st.ans[q.id];delete ORD[q.id];save();draw();updateStats();if(cb)cb();};
 }
 draw();return box;
}

}

function renderAll(){
 var h='<div class="hero noprint"><h1>كل المحتوى للطباعة</h1><p>اضغط «طباعة» ثم احفظ كـ PDF.</p><div class="row"><button class="btn ghost" onclick="window.print()">🖨 طباعة / حفظ PDF</button></div></div>';
 SECTIONS.forEach(function(s,i){h+='<section class="printSec">'+sectionHTML(s,i)+"</section>";});
 $("#main").innerHTML=h+footer();
}

function renderGlossary(q0){
 var h='<div class="secHead"><h1>قاموس المصطلحات</h1><div class="en">Glossary</div></div><input id="gq" type="search" placeholder="ابحث في المصطلحات..." style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:1rem"><div class="gl" id="gl" style="margin-top:14px"></div>';
 $("#main").innerHTML=h+footer();
 function draw(){var q=$("#gq").value.trim().toLowerCase();
  $("#gl").innerHTML=GLOSS.filter(function(g){return !q||g.t.toLowerCase().indexOf(q)>-1||g.d.toLowerCase().indexOf(q)>-1;}).map(function(g){return '<div class="card"><h3>'+esc(g.t)+"</h3><p style='margin:0'>"+esc(g.d)+"</p>"+(g.c?'<span class="badge">يحتاج إلى مراجعة</span>':"")+"</div>";}).join("")||"<p>لا توجد نتائج.</p>";}
 $("#gq").oninput=draw;if(q0)$("#gq").value=q0;draw();
}

function renderConfirm(){
 var h='<div class="secHead"><h1>راجع هذه النقاط مع المدرب</h1><div class="en">Needs Confirmation</div></div><div class="confirmBox">هذه النقاط وردت غير واضحة أو غير مكتملة في المادة الأصلية، ولا يجب اعتبارها تعليمات مؤكدة أو إجابات فنية معتمدة.</div><div class="card"><ol>'+CONFIRM.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ol></div>";
 $("#main").innerHTML=h+footer();
}

/* ===== وضع الاختبار ===== */
var QZ=null;
function startQuiz(id,lvl,list){
 var ids;
 if(list)ids=list;
 else if(id==="all")ids=shuffle(QS.filter(function(q){return !lvl||q.lvl===lvl;}).map(function(q){return q.id;}));
 else if(id==="wrong")ids=QS.filter(function(q){return st.ans[q.id]&&!st.ans[q.id].ok;}).map(function(q){return q.id;});
 else ids=QS.filter(function(q){return q.sec===id&&(!lvl||q.lvl===lvl);}).map(function(q){return q.id;});
 QZ={id:id,lvl:lvl||0,list:ids,i:0,done:false,review:false};
}
function qById(id){return QS.filter(function(q){return q.id===id;})[0];}
function renderQuiz(id){
 if(!QZ||QZ.id!==id)startQuiz(id,0);
 var title=id==="all"?"اختبار شامل":id==="wrong"?"مراجعة الإجابات الخاطئة":"اختبر نفسك: "+secName(id);
 var h='<div class="secHead"><h1>'+esc(title)+"</h1></div>";
 if(id!=="wrong"){h+='<div class="lvls">'+[0,1,2,3].map(function(l){return '<button data-l="'+l+'" class="'+(QZ.lvl===l?"on":"")+'">'+(l?"المستوى "+l+" — "+LV[l]:"كل المستويات")+"</button>";}).join("")+"</div>";}
 h+='<div id="qz"></div>';
 $("#main").innerHTML=h+footer();
 document.querySelectorAll(".lvls button").forEach(function(b){b.onclick=function(){startQuiz(id,+b.getAttribute("data-l"));renderQuiz(id);};});
 drawQuiz();
}
function drawQuiz(){
 var box=$("#qz");if(!box)return;box.innerHTML="";
 if(!QZ.list.length){box.innerHTML='<div class="card">'+(QZ.id==="wrong"?"لا توجد إجابات خاطئة حاليًا. أحسنت! ✔":"لا توجد أسئلة لهذا الاختيار.")+"</div>";return;}
 if(QZ.done){return drawResult(box);}
 var q=qById(QZ.list[QZ.i]);
 var head=document.createElement("div");head.className="card";
 head.innerHTML="سؤال <strong>"+(QZ.i+1)+"</strong> من "+QZ.list.length+'<div class="bar"><i style="width:'+Math.round((QZ.i)/QZ.list.length*100)+'%"></i></div>';
 box.appendChild(head);
 var nav=document.createElement("div");nav.className="row";
 function upd(){var done=!!st.ans[q.id];var last=QZ.i===QZ.list.length-1;nav.innerHTML="";
  var b=document.createElement("button");b.className="btn";b.disabled=!done;b.textContent=last?"إنهاء وعرض النتيجة":"السؤال التالي";
  b.onclick=function(){if(last){QZ.done=true;}else QZ.i++;drawQuiz();window.scrollTo(0,0);};nav.appendChild(b);}
 box.appendChild(qCard(q,upd));box.appendChild(nav);upd();
}
function drawResult(box){
 var list=QZ.list,ok=0,wrong=[];
 list.forEach(function(id){var a=st.ans[id];if(a&&a.ok)ok++;else wrong.push(id);});
 var pct=Math.round(ok/list.length*100);
 var msg=pct>=85?"ممتاز! مستواك متميز.":pct>=60?"جيد، راجع الأسئلة الخاطئة لتثبيت المعلومة.":"تحتاج إلى مراجعة القسم مرة أخرى.";
 var c=document.createElement("div");c.className="card score";
 c.innerHTML='<div class="big">'+ok+" / "+list.length+'</div><p>النسبة: <strong>'+pct+"%</strong> — "+msg+'</p><div class="row" style="justify-content:center"><button class="btn" id="rt">إعادة الاختبار</button>'+(wrong.length?'<button class="btn ghost" id="rv">مراجعة الأسئلة الخاطئة ('+wrong.length+')</button>':"")+'<a class="btn ghost" href="#/home">الرئيسية</a></div>';
 box.appendChild(c);
 var rb=document.createElement("div");box.appendChild(rb);
 $("#rt").onclick=function(){var keep=QZ.id==="wrong"?list.slice():null;list.forEach(function(id){delete st.ans[id];delete ORD[id];});save();updateStats();
  if(keep)startQuiz(QZ.id,0,shuffle(keep));else startQuiz(QZ.id,QZ.lvl);renderQuiz(QZ.id);};
 var rv=$("#rv");if(rv)rv.onclick=function(){rb.innerHTML="<h2>الأسئلة الخاطئة</h2>";wrong.forEach(function(id){rb.appendChild(qCard(qById(id)));});};
}

/* ===================== البحث ===================== */
function plain(s){return (s.ar+" "+s.en+" "+s.problem+" "+s.when+" "+s.signs.join(" ")+" "+s.steps.join(" ")+" "+s.decision.join(" ")+" "+s.sysq.join(" ")+" "+s.script.map(function(x){return x.t;}).join(" ")+" "+s.mistakes.join(" ")+" "+s.summary).toLowerCase();}
var IDX=SECTIONS.map(function(s){return {s:s,t:plain(s)};});
var rs=$("#results"),si=$("#search");
si.addEventListener("input",function(){
 var q=si.value.trim().toLowerCase();if(!q){rs.style.display="none";return;}
 var out=[];
 IDX.forEach(function(x){if(x.t.indexOf(q)>-1)out.push('<a href="#/s/'+x.s.id+'">'+esc(x.s.ar)+'<small class="ltr">'+esc(x.s.en)+"</small></a>");});
 GLOSS.forEach(function(g){if(g.t.toLowerCase().indexOf(q)>-1||g.d.toLowerCase().indexOf(q)>-1)out.push('<a href="#/glossary?q='+encodeURIComponent(g.t)+'">مصطلح: <span class="ltr">'+esc(g.t)+"</span><small>"+esc(g.d)+"</small></a>");});
 rs.innerHTML=out.slice(0,10).join("")||'<a style="color:var(--muted)">لا توجد نتائج</a>';rs.style.display="block";
});
document.addEventListener("click",function(e){
 if(!e.target.closest(".searchWrap"))rs.style.display="none";
 var a=e.target.closest("a[href]");
 if(a){var hr=a.getAttribute("href");
  if(hr.indexOf("#/quiz")===0){QZ=null;if(location.hash===hr){e.preventDefault();route();}}
  if(hr.charAt(0)==="#"){document.body.classList.remove("menu-open");rs.style.display="none";si.value="";}
 }
});

/* ===================== التوجيه ===================== */
function route(){
 var hs=location.hash||"#/home";var parts=hs.slice(2).split("?");var path=parts[0].split("/");var qs=parts[1]||"";
 window.scrollTo(0,0);
 try{
  if(path[0]==="s"&&path[1])renderSection(path[1]);
  else if(path[0]==="glossary"){var m=/q=([^&]*)/.exec(qs);renderGlossary(m?decodeURIComponent(m[1]):"");}
  else if(path[0]==="confirm")renderConfirm();
  else if(path[0]==="all")renderAll();
  else if(path[0]==="quiz"&&path[1]){if(path[1]!=="all"&&path[1]!=="wrong"&&!secById(path[1]))renderHome();else renderQuiz(path[1]);}
  else renderHome();
 }catch(err){$("#main").innerHTML='<div class="card">حدث خطأ غير متوقع أثناء عرض الصفحة.</div>';}
 markActive();updateStats();
}
window.addEventListener("hashchange",route);
applyTheme();buildSide();route();
</script>
</body>
</html>
